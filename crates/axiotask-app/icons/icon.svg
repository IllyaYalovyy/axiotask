<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="112" x2="0" y2="912" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5aa6f0"/>
      <stop offset="1" stop-color="#2f7de0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="112" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#0b2a52" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- App tile -->
  <g filter="url(#shadow)">
    <rect x="112" y="112" width="800" height="800" rx="184" fill="url(#tile)"/>
  </g>
  <rect x="112" y="112" width="800" height="800" rx="184" fill="url(#gloss)"/>

  <!-- Checklist -->
  <g>
    <!-- Row 1 (done) -->
    <rect x="246" y="328" width="104" height="104" rx="28" fill="#ffffff"/>
    <path d="M 275 382 L 292 402 L 326 360" fill="none" stroke="#2ec27e"
          stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="398" y="357" width="372" height="46" rx="23" fill="#ffffff"/>

    <!-- Row 2 -->
    <rect x="246" y="468" width="104" height="104" rx="28" fill="none"
          stroke="#ffffff" stroke-width="11" stroke-opacity="0.92"/>
    <rect x="398" y="497" width="372" height="46" rx="23" fill="#ffffff" fill-opacity="0.70"/>

    <!-- Row 3 -->
    <rect x="246" y="608" width="104" height="104" rx="28" fill="none"
          stroke="#ffffff" stroke-width="11" stroke-opacity="0.78"/>
    <rect x="398" y="637" width="300" height="46" rx="23" fill="#ffffff" fill-opacity="0.55"/>
  </g>
</svg>
