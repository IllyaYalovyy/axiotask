[package]
name = "axiotask-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "axiotask desktop app — Tauri shell over axiotask-core."

[lints]
workspace = true

# The Tauri wiring lives in a library so both entry points share it: the desktop
# binary links it as an rlib; the Android `TauriActivity` loads it as a cdylib
# (named `axiotask_app`) and calls the exported `run` mobile entry point.
[lib]
name = "axiotask_app"
crate-type = ["lib", "cdylib", "staticlib"]
path = "src/lib.rs"

[[bin]]
name = "axiotask"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
axiotask-core = { path = "../axiotask-core" }
tauri = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
jiff = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
open = { workspace = true }

# Android discards process stdout, so the default `tracing` `fmt` writer would
# make every log invisible on device (#157). `paranoid-android` provides a
# `MakeWriter` that routes the same subscriber to logcat. Android-only so desktop
# builds never pull in the ndk-sys chain.
[target.'cfg(target_os = "android")'.dependencies]
paranoid-android = "0.2"
# Android sign-in (RFC-010): the in-repo Play Services plugin. Android-only so
# desktop builds stay byte-identical and never pull it (or its Kotlin/GMS chain)
# in. It is deliberately NOT a workspace member — it only builds for Android, so
# the desktop `--workspace` gate must not try to compile its mobile bindings.
tauri-plugin-google-auth = { path = "../tauri-plugin-google-auth" }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
proptest = { workspace = true }
