name: axiotask
description: "Fast, sync-capable task manager for Google Tasks — Linux desktop and Android."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.1.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management — Riverpod 3, no codegen (RFC-011 / RESEARCH §1).
  # Held at 3.3.x: riverpod_lint pins its riverpod exactly, and the newest
  # riverpod_lint compatible with this Flutter SDK's analyzer ceiling pins
  # riverpod 3.3.2 (see T0.1 report — analyzer/kiri_check constraint chain).
  flutter_riverpod: ">=3.3.2 <3.4.0"
  # Persistence — drift 2.34.x, SQL-first on bundled sqlite3 (RESEARCH §2).
  drift: ">=2.34.0 <2.35.0"
  # Time discipline — package:clock everywhere; DateTime.now() is banned in
  # product code (RFC-011 testing strategy / RESEARCH §6).
  clock: ^1.1.2
  # Path joining for the instance-aware data/config layout (bootstrap, T2.1).
  # Already transitively locked; promoted to a direct dep because lib/ imports it.
  path: ^1.9.1
  # FFI binding to libc flock(2) for the desktop single-instance guard (#48,
  # T2.1). Rust's File::try_lock uses flock; dart:io's RandomAccessFile.lock is
  # fcntl (per-process, so it can't guard against a second in-process holder),
  # so we bind flock directly. Already transitively locked; promoted to direct.
  ffi: ^2.2.0
  # Local UUIDs for rows created before their first push (default list, and the
  # command layer to come) — the port of `uuid::Uuid::new_v4()`. Already
  # transitively locked; promoted to a direct dep.
  uuid: ^4.6.0
  # Per-platform app directory resolution — the Flutter analog of the reference's
  # Tauri path resolver (#170). Desktop derives data/config from XDG env, but
  # Android's only app-writable root comes from the platform, without which the
  # store can never open on device. Desktop-Linux uses the XDG env directly.
  path_provider: ^2.1.5
  # HTTP transport for the Google Tasks REST client (api/http_tasks_api.dart,
  # T3.1) — the Dart analog of the reference crate's reqwest dependency. Already
  # transitively locked; promoted to a direct dep because lib/ imports it. Tests
  # drive it through a scripted fake http.Client (package:http/testing).
  http: ^1.6.0
  # Routing — go_router, one hand-rolled adaptive shell (RESEARCH §7).
  go_router: ^17.4.0
  # Windowing — size persistence on desktop. Pinned: 0.5.x is mid-migration to
  # nativeapi-flutter and must be wrapped, not spread through the app (RESEARCH §8).
  window_manager: 0.5.2
  # Desktop OAuth — googleapis_auth owns the token exchange + refresh
  # (RFC-011 / MIGRATION-PLAN §2 auth: flow.rs/pkce.rs/client.rs → replaced by
  # this crate). We keep our own loopback redirect parsing and PKCE (the ports
  # of parse_redirect/pkce.rs) and drive googleapis_auth's
  # obtainAccessCredentialsViaCodeExchange for the code→token step; wrapper
  # tests (T6.1) pin that the exchange sends client_secret and that a missing
  # refresh_token is a sign-in failure, so a googleapis_auth divergence is
  # caught by a test, not the user. Resolves cleanly under the analyzer-12
  # ceiling (T0.1). Android never uses this — Play Services owns the grant.
  googleapis_auth: ^2.3.3
  # SHA-256 for the PKCE S256 challenge (pkce.dart, the port of pkce.rs).
  # Already transitively locked; promoted to a direct dep because lib/ imports it.
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device/desktop smoke tests. Version is pinned by the Flutter SDK; the
  # gate runs the integration_test/ suite under xvfb on the Linux desktop
  # engine (a real window + IPC path the host-VM widget tests never exercise).
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # drift codegen — generates the database class from hand-written .drift files.
  # SQL-first: build_runner is a one-shot tool, never in the TDD loop (RESEARCH §2).
  # Landed in T1.2 with the first .drift file (store/schema.drift). T0.1 deferred
  # build_runner on the belief its current release needed analyzer 13.3+; in fact
  # build_runner 2.15.x resolves cleanly against the meta 1.18.0 / analyzer 12.1
  # ceiling this SDK pins, so it is added here. Generated code is committed
  # (RESEARCH §2); codegen never runs in the TDD loop.
  drift_dev: ">=2.34.0 <2.34.1"
  build_runner: ">=2.15.0 <2.16.0"
  # Golden test harness — alchemist over matchesGoldenFile (RESEARCH §5).
  alchemist: ^0.14.0
  # Property-based testing — the only maintained Dart PBT lib. Pinned and used
  # only behind test/support/property_check.dart (RESEARCH §5).
  kiri_check: 1.3.1
  # Boundary-seam mocking only; the Tasks API uses a hand-written fake (RESEARCH §5).
  mocktail: ^1.0.5
  # Deterministic time in engine/timer tests (RESEARCH §6).
  fake_async: ^1.3.3
  # StreamQueue drives the store's watch*() streams deterministically in tests
  # (await the next emission — no arbitrary pumps). First-party Dart package,
  # already resolved transitively; pinned to the locked line.
  async: ^2.13.0
  # Analysis-time enforcement of Riverpod rules. riverpod_lint 3.1.x is a
  # NATIVE `dart analyze` plugin (analysis_server_plugin) — it no longer rides
  # on custom_lint, which cannot resolve against this SDK's analyzer anyway
  # (custom_lint needs analyzer ^8; see T0.1 report for why the plan's
  # custom_lint host is retired). Held at 3.1.4/3.1.5 to keep analyzer at 12.x,
  # the ceiling kiri_check's `package:test` allows under the SDK test_api pin.
  riverpod_lint: ">=3.1.4 <3.1.6"

