name: axiotask
description: A native Flutter client for Google Tasks.
publish_to: 'none'
version: 1.5.7+44

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.50.0 <4.0.0'

dependencies:
  connectivity_plus: 7.3.1
  crypto: 3.0.7
  drift: 2.34.3
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: 10.3.1
  google_sign_in: 7.2.0
  http: 1.6.0
  jose: 0.3.5+2
  material_ui: ^1.11.0
  oauth2: 2.0.5
  path_provider: 2.1.6
  shared_preferences: 2.5.5
  sqlite3: 3.5.1
  toml: 0.18.0
  url_launcher: 6.3.2

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.5
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
