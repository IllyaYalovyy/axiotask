name: axiotask
description: A native Flutter client for Google Tasks.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <3.13.0'
  flutter: '>=3.44.0 <3.45.0'

dependencies:
  drift: 2.34.3
  flutter:
    sdk: flutter
  flutter_secure_storage: 10.3.1
  path_provider: 2.1.6
  sqlite3: 3.5.1

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.5
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
