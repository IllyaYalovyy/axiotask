name: Tests and commit artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep every pushed commit's run, even if another commit arrives meanwhile.
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

jobs:
  quality:
    name: Analysis, unit, widget, golden and shell tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Check generated code
        if: ${{ !cancelled() }}
        run: ./scripts/check_generated.sh
      - name: Analyze
        if: ${{ !cancelled() }}
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Unit, widget and golden tests with coverage
        if: ${{ !cancelled() }}
        run: |
          mkdir -p test-results
          flutter test --no-pub --coverage --reporter expanded 2>&1 | tee test-results/flutter-tests.log
      - name: Deep synchronization stress tests
        if: ${{ !cancelled() }}
        run: ./scripts/deep_sync.sh
      - name: All shell regression tests
        if: ${{ !cancelled() }}
        run: |
          failed=0
          for suite in test/*_test.sh; do
            bash "$suite" || failed=1
          done
          exit "$failed"
      - name: Privacy check
        if: ${{ !cancelled() }}
        run: ./scripts/privacy_check.sh
      - name: Desktop metadata
        if: ${{ !cancelled() }}
        run: |
          desktop-file-validate linux/packaging/*.desktop
          appstreamcli validate --no-net linux/packaging/*.metainfo.xml
      - name: Upload coverage and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ github.sha }}
          path: |
            coverage/
            test-results/
            test/**/failures/
          retention-days: 14
          if-no-files-found: warn

  linux-integration:
    name: Linux native integration and screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - name: Native integration tests with Secret Service
        run: xvfb-run -a -s '-screen 0 1920x1200x24' dbus-run-session -- ./scripts/ci_linux_integration.sh
      - name: Capture all synthetic desktop scenarios
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1920x1200x24' dbus-run-session -- ./scripts/ci_screenshots.sh
      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-evidence-${{ github.sha }}
          path: |
            test-results/
            screenshots/actual/
          retention-days: 14
          if-no-files-found: warn

  android-integration:
    name: Android emulator native probes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-flutter
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test SQLite and preferences on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p test-results
            bash -o pipefail -c 'flutter test --no-pub integration_test/database_native_probe_test.dart integration_test/preferences_native_smoke_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee test-results/android-tests.log'
      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-evidence-${{ github.sha }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  linux-artifact:
    name: Publish Linux release bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter build linux --release --no-pub
      - name: Archive executable bundle and checksum
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf "dist/axiotask-linux-x64-${GITHUB_SHA}.tar.gz" .
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: axiotask-linux-x64-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

  android-artifact:
    name: Publish Android development APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-flutter
      # Commit artifacts are development builds; tag distributions are signed below.
      - run: flutter build apk --debug --no-pub
      - run: ./scripts/check_android_native_assets.sh
      - name: Name APK by commit and generate checksum
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/axiotask-android-debug-${GITHUB_SHA}.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: axiotask-android-debug-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

  distribution:
    name: Build and verify installable release packages
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # FIRST, before any build: does this tag describe this tree? A failure
      # here costs a deleted tag; the same mistake caught later costs a
      # published release that cannot be withdrawn.
      - name: The tag must equal the pubspec version
        run: bash tool/release_guard.sh "${GITHUB_REF_NAME}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: ./.github/actions/setup-flutter

      # clang/cmake/ninja/pkg-config/libgtk-3-dev: what `flutter build linux`
      # needs and the runner image does not ship. rpm: rpmbuild, for
      # tool/build_rpm.sh. lintian: the .deb inspection. appstream and
      # desktop-file-utils: both packagers validate the metadata they are about
      # to ship and refuse to build if it is invalid. python3: runs
      # tool/normalize_runpath.py, the step that rewrites the bundled libraries'
      # build-tree RUNPATH to $ORIGIN (#301) — both packagers ABORT when it is
      # missing rather than package the build tree's search paths.
      - name: Install the Linux build and packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            rpm lintian appstream desktop-file-utils python3 flatpak librsvg2-common

      - run: flutter pub get --enforce-lockfile

      - name: Build the Linux release bundle
        run: flutter build linux --release --no-pub

      # Both packages are built from the ONE bundle above: a second build would
      # be a second, differently-verified binary in the same release.
      - name: Package the RPM
        run: bash tool/build_rpm.sh --bundle build/linux/x64/release/bundle

      - name: Install the pinned Flatpak runtime and SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//49 org.gnome.Sdk//49

      - name: Package and verify the Flatpak
        run: bash tool/build_flatpak.sh --bundle build/linux/x64/release/bundle

      - name: Package the DEB
        run: bash tool/build_deb.sh --bundle build/linux/x64/release/bundle

      # Without --fail-on, lintian prints its findings and exits 0 — which is
      # the same as not running it.
      - name: lintian
        run: lintian --fail-on error,warning dist/*.deb

      # The pinned Depends claim the package installs on Ubuntu 24.04. This is
      # the only step that actually asks apt.
      - name: Install the DEB in ubuntu:24.04
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" ubuntu:24.04 bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq /dist/axiotask_*.deb
            test -x /usr/bin/axiotask
            test -f /usr/share/applications/io.github.IllyaYalovyy.axiotask.desktop
            test -f /usr/share/metainfo/io.github.IllyaYalovyy.axiotask.metainfo.xml
            if ldd /usr/lib/axiotask/axiotask | grep -q "not found"; then
              echo "the installed binary has unresolved libraries" >&2
              exit 1
            fi
            dpkg -V axiotask
            apt-get remove -y -qq axiotask
          '

      # Pin the exact OAuth-registered signing key; never use a generated fallback.
      - name: Write the Android signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] \
             || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::the ANDROID_KEYSTORE_* secrets are not set — refusing to publish an APK without the OAuth-registered signing key"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/axiotask-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/axiotask-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build the release APK
        run: |
          # Flutter regenerates the registrant in release mode here, excluding
          # integration_test. --no-pub would retain the development registrant.
          flutter build apk --release
          git diff --exit-code -- pubspec.lock
          ./scripts/check_android_native_assets.sh build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/axiotask-${GITHUB_REF_NAME#v}.apk"

      - name: Verify the OAuth-registered signing certificate and release identity
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$apksigner" verify --print-certs "dist/axiotask-${GITHUB_REF_NAME#v}.apk" | tee dist/ANDROID_SIGNING_CERT.txt
          # This historical certificate is registered with Google for com.axiotask.app.
          # Its subject says Android Debug, but release builds remain non-debuggable.
          # Check its fingerprint rather than the subject or the broken 1.5.3 key.
          expected=1935e06653e69ddaf6e616a6f2c35b53425f14a3e94cd8daaf219338757cb796
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/ANDROID_SIGNING_CERT.txt)
          test "$actual" = "$expected"
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test "$("$apkanalyzer" manifest application-id dist/*.apk)" = com.axiotask.app
          test "$("$apkanalyzer" manifest debuggable dist/*.apk)" = false

      - name: Checksums
        run: |
          cd dist
          sha256sum axiotask*.rpm axiotask*.deb axiotask*.flatpak axiotask*.apk ANDROID_SIGNING_CERT.txt > SHA256SUMS
          cat SHA256SUMS

      - name: Retain verified distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ github.ref_name }}
          path: |
            dist/axiotask*.rpm
            dist/axiotask*.deb
            dist/axiotask*.flatpak
            dist/axiotask*.apk
            dist/SHA256SUMS
            dist/ANDROID_SIGNING_CERT.txt
          if-no-files-found: error


  github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, linux-integration, android-integration, linux-artifact, android-artifact, distribution]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distribution-${{ github.ref_name }}
          path: dist
      - name: Verify complete release assets
        run: |
          bash tool/release_guard.sh "${GITHUB_REF_NAME}"
          python3 scripts/check_release_assets.py dist
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Axiotask $RELEASE_TAG" --notes-file docs/release-notes.md
