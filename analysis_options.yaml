# Static analysis configuration. `flutter analyze` must be clean at all times;
# the verify gate treats any diagnostic (info included) as a failure.

include: package:flutter_lints/flutter.yaml

# riverpod_lint 3.1.x is a NATIVE analysis_server_plugin (not custom_lint —
# that host was retired in T0.1 as irreconcilable with the analyzer-12 stack).
# `dart analyze` loads this plugin and reports its rules (e.g.
# missing_provider_scope); `flutter analyze` does NOT run analyzer plugins, so
# the gate runs BOTH — flutter analyze for the framework lints and
# `dart analyze --fatal-infos --fatal-warnings` for the Riverpod rules. This
# `plugins:` block is what T0.1 deferred here (see .ktask report-1).
plugins:
  riverpod_lint: 3.1.4

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Lints are errors: nothing lands with warnings waved through.
    invalid_annotation_target: error
    missing_return: error
    dead_code: error

linter:
  rules:
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    avoid_type_to_string: true
    cancel_subscriptions: true
    close_sinks: true
    directives_ordering: true
    only_throw_errors: true
    prefer_final_locals: true
    prefer_single_quotes: true
    require_trailing_commas: true
    test_types_in_equals: true
    throw_in_finally: true
    unawaited_futures: true
    unnecessary_statements: true
