# fastforge (flutter_distributor) distribute config.
#
#   dart pub global activate flutter_distributor   # one-time, installs fastforge
#   flutter_distributor package --platform linux --targets rpm
#
# Builds the release Linux bundle and produces an RPM under dist/ using the
# maker config at linux/packaging/rpm/make_config.yaml. Requires `rpmbuild`
# (Fedora: `sudo dnf install rpm-build`). See tool/build_rpm.sh for the
# fastforge-free equivalent used when the operator would rather not install the
# global tool.
output: dist/
releases:
  - name: prod
    jobs:
      - name: linux-rpm
        package:
          platform: linux
          target: rpm
