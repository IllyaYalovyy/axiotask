# fastforge (flutter_distributor) RPM maker config for the Linux desktop build.
#
# Consumed by `flutter_distributor package --platform linux --targets rpm`
# (see ../../../distribute_options.yaml). fastforge derives Version from
# pubspec.yaml, bundles the `flutter build linux --release` output under
# /usr/lib/axiotask, and installs the launcher + desktop entry + icon.
#
# AppStream metainfo (linux/packaging/io.github.illyayalovyy.axiotask.metainfo.xml)
# is what software centres display; the RPM installs it to /usr/share/metainfo.
#
# APPLICATION ID (#227): the shipped desktop entry is
# linux/packaging/io.github.illyayalovyy.axiotask.desktop and MUST be installed
# under that basename — it is the GTK APPLICATION_ID the runner sets, and GNOME
# on Wayland resolves a running window's icon by matching app_id to a desktop
# file of the same name. `package_name` below is the RPM package / binary /
# icon-theme name, which stays the short `axiotask`.
# tool/build_rpm.sh installs the entry under the application id and its
# --dry-run fails on any drift. fastforge derives the desktop entry it generates
# from `package_name`, so an RPM produced through the fastforge path has NOT
# been shown to carry the correct basename — verify the generated
# /usr/share/applications entry before releasing through that path.
#
# This file is the single source of the RPM's METADATA. tool/build_rpm.sh is a
# standalone, fastforge-free path that renders an equivalent spec and calls
# rpmbuild directly; the two are kept in sync and both are covered by
# test/packaging/rpm_packaging_test.dart. When you change metadata here, change
# the render block in tool/build_rpm.sh to match (the test enforces it).
display_name: Axiotask
package_name: axiotask
generic_name: Task Manager
license: GPLv3+
summary: Fast, offline-first Google Tasks client
description: |
  axiotask is a fast, local-first frontend for Google Tasks. One Flutter
  codebase, one UI, for Linux desktop and Android: launches in under two
  seconds, fully usable offline, and every frequent action is one gesture.
categories:
  - Office
  - ProjectManagement
keywords:
  - tasks
  - todo
  - google
  - productivity
# Runtime libraries the release bundle links against but does NOT vendor
# (GTK/GLib are the host toolkit; sqlite3 is vendored under bundle/lib).
# Verified with ldd on build/linux/x64/release/bundle/axiotask.
dependencies:
  - gtk3
  - glib2
